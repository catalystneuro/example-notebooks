name: PR Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # Every gh-pages deploy across workflows shares this group so pushes to
    # the branch never race.
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests jinja2 nbformat pyyaml 'dandi>=0.74.0'

      - name: Render index
        env:
          REGISTRY_SITE_URL: ${{ vars.REGISTRY_SITE_URL }}
        run: python .github/scripts/collect_and_render.py

      - name: Deploy preview to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          destination_dir: pr-preview/${{ github.event.pull_request.number }}
          keep_files: true
          commit_message: "Deploy preview for PR #${{ github.event.pull_request.number }}"
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: Comment PR with preview URL
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-preview
          message: |
            ## Index page preview

            A preview of the generated `index.html` has been deployed for this PR:

            **[View preview](${{ vars.REGISTRY_SITE_URL || 'https://notebooks.dandiarchive.org' }}/pr-preview/${{ github.event.pull_request.number }}/)**

            _Last updated: commit `${{ github.event.pull_request.head.sha }}`_

  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      # Removes the folder of every PR that is no longer open, not only this
      # one: a queued cleanup is cancelled when another deploy queues behind it
      # in the gh-pages-deploy group, so earlier PRs' folders can be left over.
      - name: Remove preview folders of closed PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          open=$(gh pr list --repo "${{ github.repository }}" --state open --limit 1000 \
            --json number --jq '.[].number')
          removed=""
          for dir in pr-preview/*/; do
            [ -d "$dir" ] || continue
            n=$(basename "$dir")
            case "$n" in ''|*[!0-9]*) continue ;; esac
            if ! echo "$open" | grep -qx "$n"; then
              rm -rf "$dir"
              removed="$removed #$n"
            fi
          done
          if [ -z "$removed" ]; then
            echo "No preview directories to remove."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Remove previews for closed PRs:$removed"
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1

      - name: Update preview comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-preview
          message: |
            Preview for this PR has been removed (PR closed).
