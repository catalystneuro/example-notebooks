name: Test all notebooks (weekly)

# Scheduled runs are tiered (list_notebooks.py --tiered): recently active and
# featured entries every week, everything on the first Monday of the month.
# Manual runs test everything (or the filter). Results update each entry's
# health in health.json on gh-pages and its failure issue (entry_health.py).

on:
  schedule:
    # Mondays at 06:00 UTC — pre-business-hours for both US and EU
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      filter:
        description: 'Optional substring filter on notebook paths (regex)'
        required: false
        default: ''

permissions:
  contents: write     # publish health.json to gh-pages
  issues: write

jobs:
  list:
    name: List notebooks to test
    runs-on: ubuntu-latest
    outputs:
      notebooks: ${{ steps.list.outputs.notebooks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # entry activity for the tiers comes from git history

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install registry dependencies
        run: pip install --no-cache-dir pyyaml

      - name: List notebooks for this run
        id: list
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            all=$(python .github/scripts/list_notebooks.py --tiered)
          else
            all=$(python .github/scripts/list_notebooks.py)
          fi
          filter='${{ github.event.inputs.filter }}'
          if [ -n "$filter" ]; then
            all=$(echo "$all" | python -c "
          import json, re, sys
          pat = re.compile(r'''$filter''')
          nbs = json.load(sys.stdin)
          print(json.dumps([n for n in nbs if pat.search(n)]))
          ")
          fi
          echo "notebooks=$all" >> "$GITHUB_OUTPUT"
          count=$(echo "$all" | python -c "import json,sys;print(len(json.load(sys.stdin)))")
          echo "Will test $count notebooks:"
          echo "$all" | python -m json.tool

  test:
    name: ${{ matrix.notebook }}
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        notebook: ${{ fromJson(needs.list.outputs.notebooks) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install runner dependencies
        run: pip install --no-cache-dir uv nbformat pyyaml

      - name: Run notebook
        id: run
        continue-on-error: true
        run: |
          python .github/scripts/run_notebook.py \
            "${{ matrix.notebook }}" \
            --output-dir "$RUNNER_TEMP/notebook-test" \
            --timeout 3600

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ strategy.job-index }}
          path: ${{ runner.temp }}/notebook-test/
          retention-days: 30

      - name: Re-fail step if notebook failed
        if: steps.run.outcome == 'failure'
        run: exit 1

  report:
    name: Aggregate results, update entry health and issues
    needs: test
    if: always()
    runs-on: ubuntu-latest
    # Publishes to gh-pages alongside the index deploy; never run both at once.
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # entry activity decides `unmaintained`

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - run: pip install --no-cache-dir pyyaml

      - uses: actions/download-artifact@v4
        with:
          path: results
          pattern: result-*
          merge-multiple: true

      - name: Build report
        id: report
        run: |
          set -euo pipefail
          python <<'EOF'
          import json, os
          from pathlib import Path
          results = []
          for f in sorted(Path("results").glob("*.result.json")):
              results.append(json.loads(f.read_text()))
          passed = [r for r in results if r.get("ok")]
          failed = [r for r in results if not r.get("ok")]
          missing_bootstrap = [r for r in failed if r.get("stage") == "extract"]
          other_failed = [r for r in failed if r.get("stage") != "extract"]

          lines = [
              f"# Weekly notebook sweep — run {os.environ['GITHUB_RUN_ID']}",
              "",
              f"**Total:** {len(results)} · **Passed:** {len(passed)} · **Failed:** {len(failed)}",
              "",
          ]
          if missing_bootstrap:
              lines.append("## Notebooks missing the Colab-bootstrap install cell")
              lines.append("")
              lines.append("These notebooks lack a `!uv pip install --system` install cell. ")
              lines.append("Either add the bootstrap (run `lock_notebook.py`) or set ")
              lines.append("`test: false` with a `test_skip_reason` for the notebook in its ")
              lines.append("entry's `notebook.yaml`.")
              lines.append("")
              for r in missing_bootstrap:
                  lines.append(f"- `{r['notebook']}`")
              lines.append("")
          if other_failed:
              lines.append("## Other failures")
              lines.append("")
              for r in other_failed:
                  err = (r.get("error") or "").strip().splitlines()
                  last = next((l for l in reversed(err) if l.strip()), "")
                  lines.append(
                      f"- `{r['notebook']}` (stage: `{r['stage']}`, "
                      f"{r['duration_s']}s) — `{last[:200]}`"
                  )
              lines.append("")
          if passed:
              lines.append("## Passed")
              lines.append("")
              for r in sorted(passed, key=lambda x: x["duration_s"]):
                  lines.append(f"- `{r['notebook']}` ({r['duration_s']}s)")
              lines.append("")

          report = "\n".join(lines)
          Path("report.md").write_text(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(report)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"failed_count={len(failed)}\n")
          EOF

      - name: Update entry health and per-entry issues
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p health
          if git fetch --depth 1 origin gh-pages 2>/dev/null \
             && git show origin/gh-pages:health.json > health/health.json 2>/dev/null; then
            echo "Loaded previous health.json"
          else
            rm -f health/health.json
            echo "No previous health.json; starting fresh"
          fi
          python .github/scripts/entry_health.py \
            --results results --state health/health.json --run-url "$RUN_URL"

      - name: Publish health.json to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./health
          keep_files: true
          commit_message: "Update entry health from run ${{ github.run_id }}"
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
