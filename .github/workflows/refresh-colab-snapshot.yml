name: Refresh Colab snapshot (weekly)

# Colab rebuilds its runtime image every week or two. When its preinstalled
# versions move past `.github/colab-preinstalled.txt`, the notebooks' install
# cells start downgrading packages on Colab. This job compares the snapshot with
# googlecolab/backend-info and, when they differ, refreshes the snapshot and
# re-locks the notebooks against it, then opens (or updates) one PR for the
# snapshot file and one PR per entry for that entry's re-lock
# (open_relock_prs.py), so each entry's maintainers can `/merge` their own.

on:
  schedule:
    # Mondays at 05:00 UTC, an hour before the weekly notebook test run
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-colab-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh snapshot and re-lock
    # Forks and staging copies set REGISTRY_QUIET=true: no scheduled re-lock
    # PRs. Manual runs still work.
    if: github.event_name != 'schedule' || vars.REGISTRY_QUIET != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A PAT lets the PR trigger "Test changed notebooks"; PRs opened with
          # the default GITHUB_TOKEN do not trigger other workflows.
          token: ${{ secrets.COLAB_REFRESH_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install tooling
        run: pip install --no-cache-dir uv nbformat pyyaml

      - name: Refresh snapshot and re-lock notebooks
        id: refresh
        run: python .github/scripts/refresh_colab_snapshot.py --relock | tee refresh.log

      - name: Open or update the snapshot PR and per-entry re-lock PRs
        if: steps.refresh.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.COLAB_REFRESH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          rm -f refresh.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python .github/scripts/open_relock_prs.py --base "${{ github.event.repository.default_branch }}"
