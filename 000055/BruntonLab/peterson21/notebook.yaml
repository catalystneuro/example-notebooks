version: 0.1.0
title: Behavioral and Neural Variability of Naturalistic Arm Movements (Peterson et al. 2021)
description: Recreates select figures and tables from Peterson et al. (2021, eNeuro), which
  analyzed intracranial (ECoG) recordings from 12 human participants during thousands of
  spontaneous, unstructured arm reaches. The notebooks stream the AJILE12 dataset from DANDI
  to plot coarse behavioral labels, electrode locations and spectral power, and to tabulate
  label durations and participant characteristics.
