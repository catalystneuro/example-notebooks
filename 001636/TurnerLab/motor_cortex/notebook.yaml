title: Turner Lab M1 MPTP Parkinsonism Dataset
description: This folder contains example notebooks for DANDI:001636, single-unit electrophysiology
  recordings from primary motor cortex (M1) of macaque monkeys performing flexion/extension
  motor tasks before and after MPTP-induced parkinsonism. Pyramidal tract neurons (PTNs) and
  corticostriatal neurons (CSNs) are identified by antidromic stimulation, allowing the comparison
  of how Parkinson's pathology affects each projection class.
